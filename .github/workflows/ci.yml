name: Enterprise CI Pipeline - Code-to-Architecture Visualizer

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Lint, Typecheck & Production Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_API_BASE_URL: https://visualizer.internal
      CI: true

    steps:
      - name: 1. Checkout Repository Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Set Up Node.js Runtime Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 3. Install Production & Development Dependencies
        run: npm ci

      - name: 4. Execute Static Code Analysis & Syntax Linting
        run: npm run lint

      - name: 5. Execute Strict TypeScript Compilation Verification
        run: npm run type-check

      - name: 6. Execute Production Artifact Build Verification
        run: npm run build
